
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f2926" />
      <stop offset="50%" stop-color="#10201f" />
      <stop offset="100%" stop-color="#091413" />
    </linearGradient>
    <linearGradient id="brandEmerald" x1="120" y1="120" x2="392" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accentTeal" x1="100" y1="100" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="512" height="512" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="100" stroke="#34d399" stroke-opacity="0.2" stroke-width="4" />

  <!-- Waveform Rings -->
  <circle cx="256" cy="256" r="190" stroke="url(#accentTeal)" stroke-width="3" stroke-opacity="0.25" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="150" stroke="#34d399" stroke-width="2" stroke-opacity="0.3" />

  <!-- Center Symbol Badge -->
  <g filter="url(#shadow)">
    <!-- Stylized 'T' & Live Translation Waves -->
    <!-- Top Bar of T with curved wave tips -->
    <path d="M 148 180 C 148 168, 160 160, 172 160 L 340 160 C 352 160, 364 168, 364 180 C 364 192, 352 200, 340 200 L 172 200 C 160 200, 148 192, 148 180 Z" fill="url(#brandEmerald)" />
    
    <!-- Vertical Stem of T -->
    <path d="M 236 195 L 276 195 C 284 195, 290 201, 290 209 L 290 326 C 290 348, 272 366, 250 366 C 228 366, 210 348, 210 326 L 210 320 C 210 312, 216 306, 224 306 C 232 306, 238 312, 238 320 C 238 328, 244 334, 252 334 C 260 334, 266 328, 266 320 L 266 209 C 266 201, 258 195, 250 195 Z" fill="url(#brandEmerald)" />

    <!-- Audio Wave Bars on Left & Right -->
    <rect x="174" y="240" width="12" height="48" rx="6" fill="#38bdf8" fill-opacity="0.85" />
    <rect x="144" y="254" width="12" height="24" rx="6" fill="#34d399" fill-opacity="0.6" />
    <rect x="326" y="235" width="12" height="58" rx="6" fill="#38bdf8" fill-opacity="0.85" />
    <rect x="356" y="252" width="12" height="28" rx="6" fill="#34d399" fill-opacity="0.6" />
  </g>

  <!-- Small Linguistic Glyphs: A and अ -->
  <text x="178" y="340" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" opacity="0.8">A</text>
  <text x="312" y="340" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" opacity="0.8">अ</text>
</svg>
